name: Sync upstream rules

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
  push:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generator
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and rebuild module
        run: python3 scripts/build.py
      - name: Publish changed rules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Shadowrocket-SideStore.sgmodule build-info.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update rules from Johnshall release'
            git push
          fi
